aid: bindery
name: Bindery
description: >-
  Bindery (Bindery Books) is a community-driven, influencer-led book publishing
  platform and marketplace founded by Matt Kaye and Meg Harvey. It pairs
  established book "tastemakers" — social-media book reviewers and BookTok /
  Bookstagram creators — with emerging authors, letting each tastemaker run their
  own micro-imprint (Ezeekat Press, Boundless Press, Skies Press, and others),
  acquire titles, weigh in on creative decisions, and promote them to their
  communities in exchange for a share of net earnings. Often described as "Patreon
  meets publishing," Bindery combines traditional trade distribution and marketing
  with paid membership communities, a bookshop, exclusive reviews and author
  interviews, and iOS and Android apps. The company is backed by Bloomberg Beta.
